<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The Dip: system architecture</title>
  <desc>The browser holds the pages, the data layer, your own data and the analysis code. It fetches market data through Next.js API routes on the server, which check their inputs, ask Yahoo Finance (with Stooq as a fallback for quotes), and fall back to saved snapshot data when a live request fails.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="560" fill="#FFFFFF"/>

  <!-- ── Browser ── -->
  <rect x="20" y="20" width="380" height="520" rx="16" fill="#F7F9FC" stroke="#D6DEEA"/>
  <text x="40" y="52" font-size="16" font-weight="700" fill="#0A0A0A">Browser</text>
  <text x="40" y="72" font-size="12" fill="#737373">Everything you see, and everything you save</text>

  <rect x="40" y="90" width="340" height="66" rx="10" fill="#FFFFFF" stroke="#BBD9FF"/>
  <text x="56" y="116" font-size="14" font-weight="600" fill="#0A0A0A">Pages</text>
  <text x="56" y="138" font-size="12" fill="#525252">Dashboard · Watchlist · Screener · Portfolio ·</text>
  <text x="56" y="152" font-size="12" fill="#525252">Stock pages · Chart · Calendar · Settings</text>

  <rect x="40" y="186" width="340" height="96" rx="10" fill="#FFFFFF" stroke="#2D8CFF"/>
  <text x="56" y="212" font-size="14" font-weight="600" fill="#0A0A0A">Data layer <tspan font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#737373">lib/data.ts</tspan></text>
  <text x="56" y="234" font-size="12" fill="#525252">Caches responses in IndexedDB</text>
  <text x="56" y="252" font-size="12" fill="#525252">Merges duplicate requests</text>
  <text x="56" y="270" font-size="12" fill="#525252">Tags every value with its source and time</text>

  <rect x="40" y="312" width="340" height="80" rx="10" fill="#FFFFFF" stroke="#D6DEEA"/>
  <text x="56" y="338" font-size="14" font-weight="600" fill="#0A0A0A">Your data <tspan font-family="Consolas, Menlo, monospace" font-size="12" font-weight="400" fill="#737373">lib/store.ts</tspan></text>
  <text x="56" y="360" font-size="12" fill="#525252">Portfolio, watchlists, settings, drawings and</text>
  <text x="56" y="376" font-size="12" fill="#525252">trade plans in IndexedDB, with JSON backups</text>

  <rect x="40" y="422" width="340" height="98" rx="10" fill="#FFFFFF" stroke="#D6DEEA"/>
  <text x="56" y="448" font-size="14" font-weight="600" fill="#0A0A0A">Analysis, calculated in the browser</text>
  <text x="56" y="470" font-size="12" fill="#525252">Screener rules · indicators · verdicts</text>
  <text x="56" y="488" font-size="12" fill="#525252">Support and resistance · trend · setups</text>
  <text x="56" y="506" font-size="12" fill="#525252">Trade plans · backtest</text>

  <!-- Pages ↔ layers -->
  <line x1="120" y1="156" x2="120" y2="184" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M28,123 L28,352 L38,352" fill="none" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <path d="M380,266 L390,266 L390,470 L382,470" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

  <!-- ── Server ── -->
  <rect x="460" y="20" width="320" height="520" rx="16" fill="#F7F7F8" stroke="#E0E0E0"/>
  <text x="480" y="52" font-size="16" font-weight="700" fill="#0A0A0A">Next.js API routes</text>
  <text x="480" y="72" font-size="12" fill="#737373">On the server: a proxy to the data providers</text>

  <rect x="480" y="90" width="280" height="56" rx="10" fill="#FFFFFF" stroke="#D6DEEA"/>
  <text x="496" y="114" font-size="14" font-weight="600" fill="#0A0A0A">Input checks</text>
  <text x="496" y="134" font-size="12" font-family="Consolas, Menlo, monospace" fill="#737373">lib/apiLimits.ts</text>

  <rect x="480" y="166" width="280" height="168" rx="10" fill="#FFFFFF" stroke="#2D8CFF"/>
  <text x="496" y="192" font-size="14" font-weight="600" fill="#0A0A0A">Routes</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#404040">
    <text x="496" y="216">/api/quote</text><text x="636" y="216">/api/chart</text>
    <text x="496" y="236">/api/candles</text><text x="636" y="236">/api/market</text>
    <text x="496" y="256">/api/news</text><text x="636" y="256">/api/trending</text>
    <text x="496" y="276">/api/fundamentals</text><text x="636" y="276">/api/financials</text>
    <text x="496" y="296">/api/screener</text><text x="636" y="296">/api/search</text>
    <text x="496" y="316">/api/historical</text>
  </g>

  <rect x="480" y="374" width="280" height="96" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text x="496" y="400" font-size="14" font-weight="600" fill="#0A0A0A">Saved snapshot</text>
  <text x="496" y="420" font-size="12" font-family="Consolas, Menlo, monospace" fill="#737373">lib/server/snapshot.ts</text>
  <text x="496" y="442" font-size="12" fill="#92400E">Used when a live request fails,</text>
  <text x="496" y="458" font-size="12" fill="#92400E">and labelled "Saved snapshot"</text>

  <line x1="620" y1="146" x2="620" y2="164" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="334" x2="620" y2="372" stroke="#B45309" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="628" y="358" font-size="11" fill="#92400E">on failure</text>

  <!-- Browser → server -->
  <line x1="380" y1="226" x2="478" y2="118" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="404" y="160" font-size="11" fill="#737373" transform="rotate(-48 404 160)">fetch</text>
  <line x1="478" y1="250" x2="382" y2="250" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="396" y="243" font-size="11" fill="#737373">JSON + source</text>

  <!-- ── Upstream ── -->
  <rect x="840" y="20" width="140" height="520" rx="16" fill="#F7F7F8" stroke="#E0E0E0"/>
  <text x="858" y="52" font-size="16" font-weight="700" fill="#0A0A0A">Upstream</text>
  <text x="858" y="72" font-size="12" fill="#737373">Free data</text>

  <rect x="856" y="186" width="108" height="64" rx="10" fill="#FFFFFF" stroke="#D6DEEA"/>
  <text x="910" y="214" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="middle">Yahoo</text>
  <text x="910" y="232" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="middle">Finance</text>

  <rect x="856" y="276" width="108" height="64" rx="10" fill="#FFFFFF" stroke="#D6DEEA"/>
  <text x="910" y="302" font-size="13" font-weight="600" fill="#0A0A0A" text-anchor="middle">Stooq</text>
  <text x="910" y="320" font-size="11" fill="#737373" text-anchor="middle">quote fallback</text>

  <line x1="760" y1="218" x2="854" y2="218" stroke="#525252" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="300" x2="854" y2="306" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
</svg>
